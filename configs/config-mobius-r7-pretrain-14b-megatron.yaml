language_model:


  ####################
  # RWKV相关参数
  ####################
  # token_shift_bottleneck_size: 64
  # decay_bottleneck_size: 128


  ####################
  # 模型架构参数
  ####################
  num_layers: 40
  num_layers_in_first_pipeline_stage: null   # 第一个流水线阶段的transformer层数，null表示平均分配
  num_layers_in_last_pipeline_stage: null    # 最后一个流水线阶段的transformer层数，null表示平均分配
  account_for_loss_in_pipeline_split: False  # 在流水线分割中考虑损失层
  hidden_size: 5120          # Transformer隐藏层维度
  num_attention_heads: 80   # 注意力头数
  attention_backend: null   # 注意力后端实现（auto/local等）
  softmax_scale: null       # 注意力softmax缩放因子
  num_query_groups: null    # 分组查询注意力组数，null表示普通注意力
  ffn_hidden_size: 20480     # FFN隐藏层维度
  kv_channels: null         # KV投影维度，null表示hidden_size/num_attention_heads
  hidden_dropout: 0.0       # 隐藏层dropout概率
  attention_dropout: 0.0    # 注意力dropout概率
  fp32_residual_connection: False  # 在fp32执行残差连接
  apply_residual_connection_post_layernorm: False  # 在LayerNorm后应用残差连接
  layernorm_epsilon: 1.e-5  # LayerNorm epsilon
  layernorm_zero_centered_gamma: False  # LayerNorm gamma中心化
  add_bias_linear: False    # 在线性层添加偏置
  add_qkv_bias: False       # 在QKV投影添加偏置
  gated_linear_unit: True   # 使用门控线性单元
  activation_func: squaredrelu   # MLP激活函数
  activation_func_fp8_input_store: False  # 在FP8存储激活函数输入
  num_moe_experts: null     # MoE专家数，null表示不使用MoE
  rotary_interleaved: False # RoPE旋转方式（交错式/分块式）
  window_size: null         # 滑动窗口注意力窗口大小
  normalization: "LayerNorm"  # 归一化类型（LayerNorm/RMSNorm）
  qk_layernorm: False       # 对Q/K应用LayerNorm
  test_mode: False          # 启用测试模式
  calculate_per_token_loss: False  # 按实际token数计算损失
  multi_latent_attention: False  # 使用多潜在注意力
  account_for_embedding_in_pipeline_split: False  # 在流水线分割中考虑嵌入层

  ####################
  # 初始化参数
  ####################
  init_method: null         # 权重初始化方法
  output_layer_init_method: null  # 输出层初始化方法
  init_method_std: 0.02     # 初始化标准差
  init_model_with_meta_device: False  # 使用meta设备初始化
  
  ####################
  # 混合精度参数
  ####################
  apply_query_key_layer_scaling: False  # 应用查询键层缩放
  attention_softmax_in_fp32: False      # 在fp32执行注意力softmax
  
  ####################
  # 算子融合参数
  ####################
  bias_activation_fusion: False  # 偏置激活融合
  masked_softmax_fusion: True    # 掩码softmax融合
  persist_layer_norm: False      # 持久化LayerNorm
  memory_efficient_layer_norm: False  # 内存高效LayerNorm
  bias_dropout_fusion: True      # 偏置dropout融合
  apply_rope_fusion: False        # RoPE融合
  
  ####################
  # 激活重计算参数
  ####################
  recompute_granularity: full    # 重计算粒度（selective/full）
  recompute_method: uniform      # 重计算方法（uniform/block）
  recompute_num_layers: 1        # 重计算层数
  distribute_saved_activations: null  # 分布式保存激活
  
  ####################
  # FP8相关参数
  ####################
  fp8: False                # FP8模式（e4m3/hybrid）
  fp8_margin: 0            # FP8缩放因子计算边界
  fp8_interval: 1          # （已弃用）缩放因子更新间隔
  fp8_amax_history_len: 1  # AMAX历史窗口长度
  fp8_amax_compute_algo: "most_recent"  # AMAX计算算法
  fp8_wgrad: False          # FP8权重梯度计算
  fp8_dot_product_attention: False  # FP8点积注意力
  fp8_multi_head_attention: False  # FP8多头注意力
  tp_only_amax_red: False  # 仅在TP域减少AMAX
  first_last_layers_bf16: False  # 首尾层保持BF16
  
  ####################
  # MoE相关参数
  ####################
  moe_shared_expert_intermediate_size: null  # 共享专家中间维度
  moe_shared_expert_overlap: False  # 共享专家计算重叠
  moe_layer_freq: 1        # MoE层频率
  moe_ffn_hidden_size: null  # MoE FFN隐藏维度
  moe_router_load_balancing_type: "aux_loss"  # 负载均衡类型
  moe_router_topk: 2       # 每个token路由专家数
  moe_router_topk_limited_devices: null  # 设备限制路由的EP设备数（已弃用，建议使用moe_router_num_groups）
  moe_router_num_groups: null  # 路由组数
  moe_router_group_topk: null  # 路由组选择数
  moe_router_pre_softmax: False  # 预softmax路由
  moe_router_topk_scaling_factor: null  # 路由分数缩放因子
  moe_router_score_function: "softmax"  # 路由评分函数
  moe_router_dtype: null   # 路由数据类型
  moe_router_enable_expert_bias: False  # 专家偏置路由
  moe_router_bias_update_rate: 1e-3  # 专家偏置更新率
  moe_grouped_gemm: False  # 分组GEMM优化
  moe_use_legacy_grouped_gemm: False  # 使用旧版分组GEMM
  moe_aux_loss_coeff: 0    # 辅助损失系数
  moe_z_loss_coeff: null   # Z损失系数
  moe_input_jitter_eps: null  # 输入抖动epsilon
  moe_token_dropping: False  # token丢弃
  moe_token_dispatcher_type: null  # token分发类型
  moe_enable_deepep: False  # 启用DeepEP
  moe_per_layer_logging: null  # 分层日志
  moe_expert_capacity_factor: null  # 专家容量因子
  moe_pad_expert_input_to_capacity: null  # 填充专家输入
  moe_token_drop_policy: null  # token丢弃策略
  moe_layer_recompute: null  # MoE层重计算
  moe_permute_fusion: False  # 置换操作融合
  
  ####################
  # 上下文并行参数
  ####################
  cp_comm_type: null       # 上下文并行通信类型
  
  ####################
  # CUDA Graphs参数
  ####################
  enable_cuda_graph: False  # 启用CUDA图
  cuda_graph_use_single_mempool: False  # 使用单内存池
  cuda_graph_retain_backward_graph: False  # 保留反向图
  cuda_graph_warmup_steps: 3  # CUDA图预热步数
  external_cuda_graph: False  # 使用外部CUDA图
  cuda_graph_scope: "full"  # CUDA图作用域
  
  ####################
  # 其他参数
  ####################
  clone_scatter_output_in_embedding: True  # 克隆分散输出
  disable_parameter_transpose_cache: null  # 禁用转置缓存
  config_logger_dir: ""     # 配置日志目录
  flash_decode: False       # 使用Flash解码
  use_te_rng_tracker: False  # 使用TE RNG跟踪器
  inference_rng_tracker: False  # 推理RNG跟踪器
  use_custom_fsdp: False    # 使用自定义FSDP
  is_hybrid_model: False    # 混合模型标识
  
  ####################
  # Mamba相关参数
  ####################
  # mamba_state_dim: 128      # Mamba状态维度
  # mamba_head_dim: 64        # Mamba头维度
  # mamba_num_groups: 8       # Mamba分组数

  ####################
  # 自定义参数（原配置文件特有）
  ####################
  D_AAA_LORA: 128
  D_DECAY_LORA: 128
  D_GATE_LORA: 544
  D_MV_LORA: 96

model_parallel:
  ###################
  # Model parallelism
  ###################
  # 模型并行配置
  tensor_model_parallel_size: 2  # [必须] 层内模型并行，将张量拆分到GPU上
  pipeline_model_parallel_size: 1  # [必须] 层间模型并行，将Transformer层拆分到GPU上
  virtual_pipeline_model_parallel_size: null  # 虚拟流水线并行大小，用于交错式流水线并行
  sequence_parallel: True  # 序列并行，提升大模型内存效率
  context_parallel_size: 1  # 上下文并行，沿序列维度拆分输入
  hierarchical_context_parallel_sizes: null  # 分层上下文并行尺寸（列表格式）
  expert_model_parallel_size: 1  # 专家模型并行，跨数据并行维度分布Moe专家
  expert_tensor_parallel_size: null  # 专家层的张量模型并行大小
  pipeline_model_parallel_comm_backend: null  # 流水线并行通信后端（如nccl/ucc）
  num_distributed_optimizer_instances: 1
  encoder_pipeline_model_parallel_size: 0
  encoder_tensor_model_parallel_size: 0
  async_tensor_model_parallel_allreduce: False
  ###################
  # Initialization
  ###################
  # 初始化配置
  perform_initialization: False  # 是否初始化权重（加载检查点时可以关闭）
  use_cpu_initialization: False  # 是否使用CPU初始化权重（大模型建议关闭）
  enable_gloo_process_groups: False

  ###################
  # Training
  ###################
  # 训练配置
  fp16: False  # 是否使用fp16混合精度训练
  bf16: True  # 是否使用bf16混合精度训练
  params_dtype: null  # 权重初始化数据类型（自动根据bf16/fp16设置）
  enable_autocast: False  # 是否启用自动混合精度
  autocast_dtype: null  # 自动混合精度数据类型（默认使用pipeline_dtype）
  deterministic_mode: False  # 是否启用确定性模式（调试用）
  num_microbatches_with_partial_activation_checkpoints: null  # 部分激活检查点的微批次数量

  ###################
  # Optimizations
  ###################
  # 优化配置
  gradient_accumulation_fusion: True  # 梯度累积融合优化
  # use_te_rng_tracker: False  # 是否使用TransformerEngine的RNG跟踪器
  tp_comm_overlap: False  # 是否启用张量并行通信重叠
  tp_comm_bulk_wgrad: True  # 权重梯度All-Gather与Bprop GEMM重叠
  tp_comm_bulk_dgrad: True  # 数据梯度Reduce-Scatter与Bprop GEMM重叠
  tp_comm_overlap_ag: False  # All-Gather与GEMM流水线重叠（已弃用）
  tp_comm_overlap_rs: False  # Reduce-Scatter与GEMM流水线重叠（已弃用）
  tp_comm_overlap_rs_dgrad: False  # Reduce-Scatter与DGRAD GEMM重叠
  cross_entropy_loss_fusion: False  # 融合交叉熵损失计算
  cross_entropy_fusion_impl: native  # 交叉熵融合实现方式（native/te）
  tp_comm_overlap_disable_qkv: False  # 禁用QKV的AllGather重叠
  tp_comm_overlap_disable_fc1: False  # 禁用FC1的AllGather重叠
  tp_comm_bootstrap_backend: nccl  # 张量并行通信引导后端
  tp_comm_split_ag: True
  tp_comm_atomic_ag: True
  tp_comm_split_rs: True
  tp_comm_atomic_rs: True
  bias_swiglu_fusion: False # 偏置激活融合

  ###################
  # Pipeline Parallel
  ###################
  # 流水线并行配置
  pipeline_dtype: null  # 流水线通信数据类型（默认同params_dtype）
  variable_seq_lengths: False  # 是否支持可变序列长度
  overlap_p2p_comm: False  # 是否重叠流水线通信与计算
  batch_p2p_comm: True  # 是否使用批量点对点通信
  batch_p2p_sync: True  # 批量通信后是否同步
  use_ring_exchange_p2p: False  # 是否使用环形交换通信
  deallocate_pipeline_outputs: False  # 是否释放流水线输出内存
  defer_embedding_wgrad_compute: False  # 是否延迟嵌入层梯度计算
  wgrad_deferral_limit: 0  # 延迟梯度计算的微批次数量限制
  pipeline_model_parallel_split_rank: null  # 编码器/解码器拆分位置
  overlap_p2p_comm_warmup_flush: False  # 是否在预热阶段重叠通信
  microbatch_group_size_per_vp_stage: null  # 虚拟阶段微批次组大小

  ###################
  # CPU Offloading
  ###################
  # CPU卸载配置
  cpu_offloading: False  # 是否启用CPU卸载
  cpu_offloading_num_layers: 0  # 需要卸载的Transformer层数
  cpu_offloading_activations: True  # 是否卸载激活值
  cpu_offloading_weights: False  # 是否卸载权重

  ###################
  # Timing
  ###################
  # 计时配置
  barrier_with_L1_time: True  # 是否在L1计时中使用同步屏障

  ##############
  # 以下参数已弃用或内部使用 #
  ##############
  moe_extended_tp: False  # [已弃用] 被expert_tensor_parallel_size取代
  _cpu_offloading_context: null  # [内部使用] CPU卸载上下文
  finalize_model_grads_func: null  # [高级] 梯度最终化函数
  grad_scale_func: null  # [高级] 梯度缩放函数
  no_sync_func: null  # [高级] 异步通信抑制函数
  grad_sync_func: null  # [高级] 异步梯度同步函数
  param_sync_func: null  # [高级] 异步参数同步函数
  timers: null  # [高级] 计时器对象

