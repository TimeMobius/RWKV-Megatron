# Single-GPU Qwen3.8 -> RWKV7 28B online top-k distillation.
# The teacher service returns prompt_logprobs, not a full vocabulary tensor.
language_model:
  num_layers: 88
  hidden_size: 5120
  num_attention_heads: 80
  kv_channels: 64
  ffn_hidden_size: 17408
  D_AAA_LORA: 192
  D_DECAY_LORA: 192
  D_GATE_LORA: 352
  D_MV_LORA: 128
  hidden_dropout: 0.0
  attention_dropout: 0.0
  add_bias_linear: false
  add_qkv_bias: false
  activation_func: squaredrelu
  normalization: LayerNorm
  layernorm_epsilon: 1.0e-5
  persist_layer_norm: false
  bias_dropout_fusion: true
  apply_rope_fusion: false
  calculate_per_token_loss: false
  recompute_granularity: full
  recompute_method: uniform
  recompute_num_layers: 1
  fp8: false

model_parallel:
  tensor_model_parallel_size: 1
  pipeline_model_parallel_size: 1
  context_parallel_size: 1
  sequence_parallel: false
  bf16: true
  fp16: false
  perform_initialization: false
  gradient_accumulation_fusion: true
  tp_comm_overlap: false
  overlap_p2p_comm: false
  cross_entropy_loss_fusion: false

transformer_impl: local
rwkv_fp8_scope: ffn
rwkv_key_fusion: true
rwkv_l2wrap_coefficient: 0.0
rwkv_distill: true
rwkv_teacher_url: http://192.168.10.121:8000
rwkv_teacher_model: Qwen3.8-27B
rwkv_teacher_tokenizer: /hikscale/models/Qwen/Qwen3.8-27B
rwkv_teacher_top_k: 100
rwkv_teacher_timeout: 600.0
rwkv_teacher_max_retries: 3
rwkv_teacher_retry_backoff_initial: 1.0
rwkv_teacher_retry_backoff_max: 30.0
rwkv_teacher_retry_jitter: 0.2
rwkv_teacher_cache_size: 256
rwkv_distill_temperature: 2.0
rwkv_distill_valid_vocab_size: 248077
rwkv_distill_logit_weight: 1.0
rwkv_distill_ce_weight: 0.0

untie_embeddings_and_output_weights: true
position_embedding_type: none
max_position_embeddings: 16384
load_pretrained_rwkv: /hikscale/models/XiaoKe/rwkv7_28b_88_mapped.pt
load_pretrained_rwkv_source_type: rwkv-lm
check_against_pretrained: false

data_path:
- /mnt/data/Datasets/0056_qwen3.8/0056_qwen3.8_text_document
split: 99,1,0
data_cache_path: /mnt/data/Datasets/0056_qwen3.8/megatron-cache
tokenizer_type: HuggingFaceTokenizer
tokenizer_model: /hikscale/models/Qwen/Qwen3.8-27B
trust_remote_code: true
make_vocab_size_divisible_by: 256
seq_length: 128
dataloader_type: single
num_workers: 2
num_dataset_builder_threads: 2
mmap_bin_files: true
create_attention_mask_in_dataloader: false
reset_position_ids: false
reset_attention_mask: false
eod_mask_loss: false
seed: 1234
micro_batch_size: 1
global_batch_size: 1
eval_micro_batch_size: 1
eval_global_batch_size: 1
train_iters: 1
auto_train_iters: false
eval_iters: 1
eval_interval: 1

optimizer: adam
use_distributed_optimizer: false
adam_beta1: 0.9
adam_beta2: 0.995
adam_eps: 1.0e-8
weight_decay: 0.1
clip_grad: 1.0
accumulate_allreduce_grads_in_fp32: true
check_for_nan_in_loss_and_grad: true
rerun_mode: disabled
overlap_grad_reduce: false
overlap_param_gather: false
lr: 1.0e-6
min_lr: 1.0e-6
lr_decay_style: constant
lr_decay_iters: 1
lr_warmup_iters: 0
save: null
save_interval: 1000
load: null
ckpt_format: torch
no_save_optim: false
no_save_rng: false
no_load_optim: false
no_load_rng: false
use_checkpoint_args: false
async_save: false
distributed_backend: nccl
distributed_timeout_minutes: 100
manual_gc_eval: true
logging_level: 20
log_interval: 1
log_throughput: true
log_progress: true
timing_log_level: 0
timing_log_option: minmax
tensorboard_dir: null
wandb_project: ''
wandb_exp_name: ''
wandb_save_dir: null
enable_one_logger: false

# Megatron gates W&B throughput and iteration-time on this timer flag.
log_timers_to_tensorboard: true
log_memory_to_tensorboard: true
